name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review
  push:
    branches:
      - master

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  swiftlint:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: GitHub Action for SwiftLint with --strict
        uses: norio-nomura/action-swiftlint@3.2.1
        with:
          args: --strict

  swiftformat:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5.2.10
        env:
          MISE_DISABLE_TOOLS: ruby

      - name: Show Swift version
        run: swift --version

      - name: Run swift-format
        run: mise run lint
        env:
          MISE_DISABLE_TOOLS: ruby

  build:
    needs: [swiftlint, swiftformat]
    if: github.event.pull_request.draft == false
    runs-on: xcode-27
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5.2.10
        env:
          MISE_DISABLE_TOOLS: ruby

      - name: Set Xcode version
        uses: ./.github/actions/setup-xcode

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - uses: irgaly/xcode-cache@v1
        with:
          key: xcode-cache-deriveddata-${{ github.job }}-${{ github.workflow }}-${{ github.sha }}
          restore-keys: xcode-cache-deriveddata-${{ github.job }}-${{ github.workflow }}-
          swiftpm-cache-key: xcode-cache-sourcepackages-${{ github.workflow }}-${{ github.sha }}
          swiftpm-cache-restore-keys: xcode-cache-sourcepackages-${{ github.workflow }}-

      - name: Build
        run: |
          mise run build
        env:
          MISE_DISABLE_TOOLS: ruby
          LICENSE_PLIST_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    needs: [swiftlint, swiftformat]
    if: github.event.pull_request.draft == false
    runs-on: xcode-27
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5.2.10
        env:
          MISE_DISABLE_TOOLS: ruby

      - name: Set Xcode version
        uses: ./.github/actions/setup-xcode

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - uses: irgaly/xcode-cache@v1
        with:
          key: xcode-cache-deriveddata-${{ github.job }}-${{ github.workflow }}-${{ github.sha }}
          restore-keys: xcode-cache-deriveddata-${{ github.job }}-${{ github.workflow }}-
          swiftpm-cache-key: xcode-cache-sourcepackages-${{ github.workflow }}-${{ github.sha }}
          swiftpm-cache-restore-keys: xcode-cache-sourcepackages-${{ github.workflow }}-

      - name: Select simulator
        id: select_simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | jq -r '
            .devices
            | to_entries
            | map(select(.key | contains("com.apple.CoreSimulator.SimRuntime.iOS")))
            | max_by(.key)
            | .value
            | .[]
            | select(.name | startswith("iPhone"))
            | .udid
          ' | head -n 1)
          echo "Selected simulator: $DEVICE_ID"
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      # Build before the simulator boots: a booted simulator saturates the runner
      # and slows down everything else, including SPM resolution and compilation
      - name: Build for testing
        id: build_for_testing
        run: |
          mise run build-for-testing --destination "id=$DEVICE_ID"
          XCTESTRUN=""
          for f in "$HOME"/Library/Developer/Xcode/DerivedData/SpoolDays-*/Build/Products/*.xctestrun; do
            if [ -z "$XCTESTRUN" ] || [ "$f" -nt "$XCTESTRUN" ]; then
              XCTESTRUN=$f
            fi
          done
          echo "Using $XCTESTRUN"
          echo "xctestrun=$XCTESTRUN" >> "$GITHUB_OUTPUT"
        env:
          DEVICE_ID: ${{ steps.select_simulator.outputs.device_id }}
          MISE_DISABLE_TOOLS: ruby
          LICENSE_PLIST_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # https://github.com/actions/runner-images/issues/12777
      - name: Workaround for hanging simulator
        timeout-minutes: 12
        run: |
          brew install coreutils -q

          echo "--------------------------------"
          echo "👀 Updating dyld_shared_cache:"
          xcrun simctl runtime dyld_shared_cache update --all
          echo "--------------------------------"
          echo "👀 Booting simulator: with ID: $DEVICE_ID"

          i=1
          max=5
          while [ $i -le $max ]; do
            echo "👀 Launching Simulator (Attempt $i/$max)"
            # Brewfile installs coreutils which includes gtimeout
            if gtimeout -s SIGKILL 2m xcrun simctl bootstatus "$DEVICE_ID" -b; then
              echo "✅ Simulator booted successfully"
              break
            else
              echo "❌ Simulator boot timed out. Shutting down..."
              xcrun simctl shutdown "$DEVICE_ID" || true # prevents "Unable to shutdown device in current state: Shutdown" error

              echo "🔁 Retrying in 5s..."
              i=$((i + 1))
              sleep 5
            fi
          done

          if [ $i -gt $max ]; then
            echo "::error::Failed to boot simulator after $max attempts."
            exit 1
          fi
        env:
          DEVICE_ID: ${{ steps.select_simulator.outputs.device_id }}

      # The booted simulator saturates the runner, so call xcodebuild directly
      # with the .xctestrun file to skip mise, bundler, fastlane and project loading
      - name: Test
        timeout-minutes: 15
        run: |
          set -o pipefail
          xcodebuild test-without-building -xctestrun "$XCTESTRUN" -destination "id=$DEVICE_ID" | xcbeautify --renderer github-actions
        env:
          DEVICE_ID: ${{ steps.select_simulator.outputs.device_id }}
          XCTESTRUN: ${{ steps.build_for_testing.outputs.xctestrun }}

      # Shut down the simulator so that the cache is saved on an idle runner
      - name: Shutdown simulator
        if: always()
        run: xcrun simctl shutdown all
